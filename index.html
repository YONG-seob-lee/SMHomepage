<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>픽셀아트 생성기 — Shaman AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>🕹️ 픽셀아트 생성기</h1>
      <p class="subtitle">사진을 올리면 픽셀아트로 변환해드려요</p>
    </div>
  </header>

  <main>

    <!-- STEP 1: 이미지 업로드 -->
    <section class="step-card" id="step-upload">
      <div class="step-label">1단계</div>
      <h2>사진 올리기</h2>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="upload-placeholder" id="uploadPlaceholder">
          <div class="upload-icon">📁</div>
          <p class="upload-main">여기에 사진을 끌어다 놓거나</p>
          <button type="button" class="btn btn-outline" id="uploadBtn">클릭해서 사진 선택</button>
          <p class="upload-hint">PNG, JPG, WEBP 파일 모두 OK · 최대 10MB</p>
        </div>
        <div class="upload-preview" id="uploadPreview" hidden>
          <img id="previewImg" src="" alt="선택한 사진" />
          <button type="button" class="btn btn-small btn-outline" id="changeBtn">다른 사진 선택</button>
        </div>
      </div>
    </section>

    <!-- STEP 2: 픽셀아트 설정 -->
    <section class="step-card" id="step-options">
      <div class="step-label">2단계</div>
      <h2>설정</h2>

      <div class="resolution-info" id="resolutionInfo" hidden>
        <span id="resInfoText"></span>
      </div>

      <div class="quality-row">
        <span class="quality-label">도트 크기</span>
        <div class="quality-btns">
          <button type="button" class="quality-btn selected" data-dotsize="auto">자동</button>
          <button type="button" class="quality-btn" data-dotsize="16">16×16</button>
          <button type="button" class="quality-btn" data-dotsize="32">32×32</button>
          <button type="button" class="quality-btn" data-dotsize="64">64×64</button>
        </div>
      </div>

      <div class="quality-row" id="formatRow">
        <span class="quality-label">저장 형식</span>
        <div class="quality-btns">
          <button type="button" class="quality-btn" data-format="png">PNG</button>
          <button type="button" class="quality-btn selected" data-format="bmp">BMP</button>
        </div>
      </div>
    </section>

    <!-- STEP 3: 원하는 것 입력 -->
    <section class="step-card" id="step-wish">
      <div class="step-label">3단계</div>
      <h2>추가 요청 <span class="optional">(선택)</span></h2>
      <textarea
        id="wishInput"
        placeholder="예: 배경을 검정으로 / 더 선명하게&#10;짧게 적어도 OK!"
        rows="3"
        maxlength="200"
      ></textarea>
      <div class="char-count"><span id="charCount">0</span> / 200</div>
    </section>

    <!-- 만들기 버튼 -->
    <div class="generate-wrap">
      <button type="button" class="btn btn-generate" id="generateBtn" disabled>
        <span class="btn-icon">🕹️</span>
        <span class="btn-text">픽셀아트로 변환</span>
      </button>
      <p class="generate-hint" id="generateHint">1단계에서 사진을 먼저 올려주세요</p>
    </div>

    <!-- 로딩 -->
    <div class="loading-wrap" id="loadingWrap" hidden>
      <div class="spinner"></div>
      <p class="loading-text">픽셀아트로 변환 중...</p>
      <p class="loading-sub">화질에 따라 30초~2분 정도 걸려요</p>
    </div>

    <!-- 결과 -->
    <section class="result-card" id="resultCard" hidden>
      <h2>✅ 완성됐어요!</h2>
      <div class="result-img-wrap">
        <img id="resultImg" src="" alt="생성된 픽셀아트" />
      </div>
      <div class="result-actions">
        <a id="downloadBtn" href="" download="pixel_art.bmp" class="btn btn-primary">
          💾 저장하기
        </a>
        <button type="button" class="btn btn-outline" id="retryBtn">
          🔄 다시 만들기
        </button>
      </div>
    </section>

    <!-- 오류 -->
    <div class="error-wrap" id="errorWrap" hidden>
      <p class="error-text" id="errorText">오류가 발생했습니다.</p>
      <button type="button" class="btn btn-outline btn-small" id="errorRetryBtn">다시 시도</button>
    </div>

  </main>

  <footer>
    <p>Shaman AI 픽셀아트 생성기 · 로컬 AI로 구동됩니다</p>
  </footer>

  <script src="config.js"></script>
  <script src="scripts/main.js?v=3"></script>
</body>
</html>
