<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이미지 변환기 — Shaman AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <h1>🎨 이미지 변환기</h1>
      <p class="subtitle">사진을 올리고, 원하는 느낌을 골라보세요</p>
    </div>
  </header>

  <main>

    <!-- STEP 1: 이미지 업로드 -->
    <section class="step-card" id="step-upload">
      <div class="step-label">1단계</div>
      <h2>사진 올리기</h2>

      <div class="upload-area" id="uploadArea">
        <input type="file" id="fileInput" accept="image/*" hidden />
        <div class="upload-placeholder" id="uploadPlaceholder">
          <div class="upload-icon">📁</div>
          <p class="upload-main">여기에 사진을 끌어다 놓거나</p>
          <button type="button" class="btn btn-outline" id="uploadBtn">클릭해서 사진 선택</button>
          <p class="upload-hint">PNG, JPG, WEBP 파일 모두 OK · 최대 10MB</p>
        </div>
        <div class="upload-preview" id="uploadPreview" hidden>
          <img id="previewImg" src="" alt="선택한 사진" />
          <button type="button" class="btn btn-small btn-outline" id="changeBtn">다른 사진 선택</button>
        </div>
      </div>
    </section>

    <!-- STEP 2: 풍 선택 -->
    <section class="step-card" id="step-style">
      <div class="step-label">2단계</div>
      <h2>느낌 고르기</h2>

      <div class="style-grid">
        <button type="button" class="style-btn" data-style="photo">
          <span class="style-icon">📷</span>
          <span class="style-name">사진풍</span>
          <span class="style-desc">실제 사진처럼</span>
        </button>
        <button type="button" class="style-btn" data-style="illust">
          <span class="style-icon">🖼️</span>
          <span class="style-name">그림풍</span>
          <span class="style-desc">일러스트 스타일</span>
        </button>
        <button type="button" class="style-btn" data-style="anime">
          <span class="style-icon">✨</span>
          <span class="style-name">애니풍</span>
          <span class="style-desc">애니메이션 스타일</span>
        </button>
        <button type="button" class="style-btn" data-style="watercolor">
          <span class="style-icon">🎨</span>
          <span class="style-name">수채화풍</span>
          <span class="style-desc">물감으로 그린 느낌</span>
        </button>
        <button type="button" class="style-btn" data-style="sketch">
          <span class="style-icon">✏️</span>
          <span class="style-name">스케치풍</span>
          <span class="style-desc">연필로 그린 느낌</span>
        </button>
        <button type="button" class="style-btn" data-style="dot">
          <span class="style-icon">🕹️</span>
          <span class="style-name">도트풍</span>
          <span class="style-desc">픽셀 아트 스타일</span>
        </button>
      </div>

      <div class="quality-row">
        <span class="quality-label">화질</span>
        <div class="quality-btns">
          <button type="button" class="quality-btn selected" data-quality="fast">빠른 결과 (512px)</button>
          <button type="button" class="quality-btn" data-quality="high">고화질 (1024px)</button>
        </div>
      </div>

      <div class="quality-row" id="cardModeRow">
        <span class="quality-label">용도</span>
        <div class="quality-btns">
          <button type="button" class="quality-btn selected" data-card="true">카드형</button>
          <button type="button" class="quality-btn" data-card="false">일반</button>
        </div>
      </div>

      <div class="quality-row" id="formatRow">
        <span class="quality-label">저장 형식</span>
        <div class="quality-btns">
          <button type="button" class="quality-btn selected" data-format="png">PNG</button>
          <button type="button" class="quality-btn" data-format="bmp">BMP</button>
        </div>
      </div>
    </section>

    <!-- STEP 3: 원하는 것 입력 -->
    <section class="step-card" id="step-wish">
      <div class="step-label">3단계</div>
      <h2>원하는 것 쓰기 <span class="optional">(선택)</span></h2>
      <textarea
        id="wishInput"
        placeholder="예: 봄 느낌으로 / 강아지 추가 / 하늘을 더 파랗게&#10;짧게 적어도 OK!"
        rows="3"
        maxlength="200"
      ></textarea>
      <div class="char-count"><span id="charCount">0</span> / 200</div>
    </section>

    <!-- 만들기 버튼 -->
    <div class="generate-wrap">
      <button type="button" class="btn btn-generate" id="generateBtn" disabled>
        <span class="btn-icon">🪄</span>
        <span class="btn-text">만들기</span>
      </button>
      <p class="generate-hint" id="generateHint">1단계에서 사진을 먼저 올려주세요</p>
    </div>

    <!-- 로딩 -->
    <div class="loading-wrap" id="loadingWrap" hidden>
      <div class="spinner"></div>
      <p class="loading-text">이미지 만드는 중...</p>
      <p class="loading-sub">화질에 따라 30초~2분 정도 걸려요</p>
    </div>

    <!-- 결과 -->
    <section class="result-card" id="resultCard" hidden>
      <h2>✅ 완성됐어요!</h2>
      <div class="result-img-wrap">
        <img id="resultImg" src="" alt="생성된 이미지" />
      </div>
      <div class="result-actions">
        <a id="downloadBtn" href="" download="shaman_result.png" class="btn btn-primary" id="downloadBtn">
          💾 저장하기
        </a>
        <button type="button" class="btn btn-outline" id="retryBtn">
          🔄 다시 만들기
        </button>
      </div>
    </section>

    <!-- 오류 -->
    <div class="error-wrap" id="errorWrap" hidden>
      <p class="error-text" id="errorText">오류가 발생했습니다.</p>
      <button type="button" class="btn btn-outline btn-small" id="errorRetryBtn">다시 시도</button>
    </div>

  </main>

  <footer>
    <p>Shaman AI 이미지 변환기 · 로컬 AI로 구동됩니다</p>
  </footer>

  <script src="config.js"></script>
  <script src="scripts/main.js?v=2"></script>
</body>
</html>
